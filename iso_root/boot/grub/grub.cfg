set timeout=2
set default=0
#set gfxpayload=text
terminal_output console

# Enable GRUB graphics
if [ "$grub_platform" = "pc" ]; then
insmod vbe
    insmod video_bochs
    insmod video_cirrus
fi
insmod all_video

loadfont /boot/grub/fonts/unicode.pf2
terminal_output gfxterm

set gfxmode=1366x768,1280x720,1024x768,auto
set gfxpayload=keep

insmod search
insmod search_label

if search --no-floppy --label NBOS --set=nbdisk; then
    set default=1          # an IDE disk labelled NBOS is attached: development mode, persistent
else
    set default=0          # no disk: RAM disk (run.sh live, USB stick)
fi

menuentry "NBOS x86_64 (RAM disk)" {
    multiboot2 /boot/kernel.elf
    module2 /boot/root.img root
    boot
}
menuentry "NBOS x86_64 (IDE disk)" {
    multiboot2 /boot/kernel.elf
    boot
}
}
